name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q tsbench
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: tsbench --help
  ubuntu-2604:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 git nodejs
      - run: python3 -m compileall -q tsbench
      - run: python3 -m unittest discover -s tests -v
