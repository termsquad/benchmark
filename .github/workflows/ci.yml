name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q tsbench
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: sudo apt-get update && sudo apt-get install -y sysbench fio
      - run: python tests/smoke_hardware.py
      - name: Check isolated install and status
        run: |
          mkdir -p "$RUNNER_TEMP/bench-home"
          HOME="$RUNNER_TEMP/bench-home" bash install.sh
          HOME="$RUNNER_TEMP/bench-home" "$RUNNER_TEMP/bench-home/.local/bin/tsbench" status
      - run: tsbench --help
  ubuntu-2604:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 git nodejs sysbench fio
      - run: python3 -m compileall -q tsbench
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/smoke_hardware.py
